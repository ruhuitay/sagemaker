[project]
name = "mnist-sagemaker"
version = "0.1.0"
description = "MNIST inference endpoint on SageMaker with Triton Inference Server"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "onnx>=1.14.0",
    "onnxscript>=0.7.0",
    "requests>=2.28.0",
    "boto3>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.82.0",
    "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src"]
