[project]
name = "mnist-sagemaker"
version = "0.1.0"
description = "MNIST inference endpoint - shared model training, export, and client code"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "python-dotenv==1.2.2",
    "oss2>=2.18.0",
    "boto3>=1.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src"]
