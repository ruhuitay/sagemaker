[project]
name = "mnist-infra-aws"
version = "0.1.0"
description = "AWS CDK infrastructure for MNIST inference endpoint on SageMaker"
requires-python = ">=3.10"
dependencies = [
    "aws-cdk-lib>=2.150.0",
    "constructs>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stacks"]
