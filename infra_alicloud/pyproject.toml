[project]
name = "mnist-infra-alicloud"
version = "0.1.0"
description = "ROS CDK infrastructure for MNIST inference endpoint on Alibaba Cloud PAI-EAS"
requires-python = ">=3.11"
dependencies = [
    "ros-cdk-core>=0.1.0",
    "ros-cdk-oss>=0.1.0",
    "ros-cdk-pai>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stacks"]
